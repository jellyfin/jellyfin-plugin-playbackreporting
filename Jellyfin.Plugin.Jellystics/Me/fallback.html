<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{title}}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 16px;
      background: #101010; color: #e8e8e8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    }
    main {
      max-width: 34rem; width: 100%; padding: 32px 28px; border-radius: 14px;
      background: #1c1c1e; border: 1px solid #2c2c2e; text-align: center;
    }
    svg { width: 48px; height: 48px; fill: #00a4dc; opacity: .85; }
    h1 { margin: 16px 0 8px; font-size: 1.4rem; font-weight: 600; }
    p { margin: 0 0 24px; line-height: 1.5; color: #b8b8bc; }
    a {
      display: inline-block; padding: 10px 18px; border-radius: 8px;
      background: #00a4dc; color: #fff; text-decoration: none; font-weight: 600;
    }
    a:hover, a:focus-visible { background: #0090c2; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main data-reason="{{reasonCode}}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
    <h1>{{title}}</h1>
    <p>{{reason}}</p>
    <a href="{{backHref}}">{{back}}</a>
  </main>
</body>
</html>

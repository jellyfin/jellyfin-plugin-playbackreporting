name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'Jellyfin.Plugin.Jellystics.Tests/js/*.test.js'
